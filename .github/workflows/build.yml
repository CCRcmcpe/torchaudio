name: torchaudio-cu132

on:
  workflow_dispatch:
    inputs:
      torch_version:
        description: "torch build to link against (cu132 index)"
        default: "2.14.0"
      ta_version:
        description: "torchaudio source tag and wheel version"
        default: "2.11.0"
      cuda_arch:
        description: "TORCH_CUDA_ARCH_LIST (semicolon separated)"
        default: "8.9"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: nvidia/cuda:13.2.1-devel-ubuntu24.04
    env:
      CUDA_HOME: /usr/local/cuda
      TORCH_CUDA_ARCH_LIST: ${{ inputs.cuda_arch }}
      BUILD_VERSION: ${{ inputs.ta_version }}+cu132
    steps:
      - name: Container tooling
        run: apt-get update && apt-get install -y --no-install-recommends git ninja-build jq curl ca-certificates

      - uses: actions/checkout@v5
        with:
          repository: pytorch/audio
          ref: v${{ inputs.ta_version }}

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.13"

      - name: Install build deps
        run: |
          uv venv .venv --python 3.13
          uv pip install --python .venv/bin/python \
            pip setuptools wheel \
            torch==${{ inputs.torch_version }}+cu132 \
            --index-url https://download.pytorch.org/whl/cu132 \
            --index-strategy unsafe-best-match

      - name: Build wheel
        run: .venv/bin/pip wheel . --no-build-isolation --no-deps -w dist

      - name: Smoke test
        run: |
          uv pip install --python .venv/bin/python dist/*.whl
          .venv/bin/python -c "import torch, torchaudio; print(torch.__version__, torchaudio.__version__, torchaudio.ops._torchaudio.cuda_version())"

      - uses: actions/upload-artifact@v5
        with:
          name: torchaudio-${{ inputs.ta_version }}-cu132
          path: dist/*.whl
